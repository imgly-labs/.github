name: labs-deploy

on:
  workflow_call:
    inputs:
      labs-url:
        description: Base URL of the labs Worker
        type: string
        default: https://labs.imgly.dev

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          projects=$(find . -name .imgly-labs.json -not -path '*/node_modules/*' -not -path './.git/*' -printf '%h\n' \
            | sed 's#^\./##' | sort | jq -R . | jq -sc .)
          echo "Found projects: $projects"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    if: github.ref == 'refs/heads/main' && needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    name: deploy ${{ matrix.project }}
    concurrency:
      group: labs-${{ github.repository }}-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # LFS files stay pointers by default: the deploy sends them as oids and labs serves them from
      # labs-objects, so their bytes are never downloaded here. They are pulled only when a project asks
      # for it ("lfs": "pull", for builds that process the bytes) or when LFS is not on lfs.imgly.dev
      # (then the bytes must be uploaded). The job's own GitHub token authenticates; it never ends up in the git config.
      - name: Fetch LFS files
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT: ${{ matrix.project }}
        run: |
          if ! git lfs ls-files --name-only | grep -q .; then echo "No LFS files"; exit 0; fi
          url=$(git config -f .lfsconfig --get lfs.url || true)
          mode=$(jq -r '.lfs // "pointer"' "$PROJECT/.imgly-labs.json")
          if [ "$mode" != "pull" ] && [ "${url#https://lfs.imgly.dev/}" != "$url" ]; then
            echo "LFS files stay pointers (download on demand: \"lfs\": \"pull\" in .imgly-labs.json)"; exit 0
          fi
          # Smaller batches keep each request well inside git-lfs's 30 s timeout.
          git config --global lfs.transfer.batchSize 20
          git config --global credential.https://lfs.imgly.dev.helper '!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          if [ "$PROJECT" = "." ]; then include="*"; else include="$PROJECT/**"; fi
          # --exclude "" overrides a repo's lfs.fetchexclude, which may skip media on normal clones.
          git lfs pull --include "$include" --exclude ""

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          build=$(jq -r '.build // empty' .imgly-labs.json)
          if [ -z "$build" ]; then echo "No build step"; exit 0; fi
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          fi
          bash -c "$build"

      - name: Bundle worker code
        id: bundle
        working-directory: ${{ matrix.project }}
        run: |
          main=$(jq -r '.main // empty' .imgly-labs.json)
          if [ -z "$main" ]; then echo "No worker code"; exit 0; fi
          out="$RUNNER_TEMP/labs-app-${{ strategy.job-index }}.js"
          npx -y esbuild@0.25.10 "$main" --bundle --format=esm --platform=neutral --target=es2022 \
            --conditions=workerd,worker,browser --main-fields=module,main \
            --external:'cloudflare:*' --external:'node:*' --outfile="$out"
          echo "app=$out" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          PROJECT_DIR: ${{ matrix.project }}
          LABS_URL: ${{ inputs.labs-url }}
          APP_BUNDLE: ${{ steps.bundle.outputs.app }}
          # Requires `secrets: inherit` in the calling workflow. Only LABS_<ID>_* secrets are forwarded.
          LABS_SECRETS: ${{ toJSON(secrets) }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { appendFile, readFile, readdir, stat } from "node:fs/promises";
          import path from "node:path";

          const dir = process.env.PROJECT_DIR;
          const labs = process.env.LABS_URL;
          const configText = await readFile(path.join(dir, ".imgly-labs.json"), "utf8");
          const config = JSON.parse(configText);
          const projectDir = path.resolve(dir);
          const inside = (p) => p === projectDir || p.startsWith(projectDir + path.sep);
          // Projects with worker code only publish an explicit assets folder, never their sources.
          const assetsSetting = config.assets ?? (config.main ? null : ".");
          const assetsDir = assetsSetting === null ? null : path.resolve(projectDir, assetsSetting);
          if (assetsDir && !inside(assetsDir)) {
            console.log(`::error::assets must stay inside ${dir}`);
            process.exit(1);
          }

          // Dotfiles (.env, .npmrc, ...) are never published, except /.well-known.
          // Nested folders with their own .imgly-labs.json are separate projects.
          async function* walk(d, top) {
            for (const e of await readdir(d, { withFileTypes: true })) {
              if (e.name.startsWith(".") && !(top && e.name === ".well-known" && e.isDirectory())) continue;
              if (e.name === "node_modules") continue;
              const p = path.join(d, e.name);
              if (e.isDirectory()) {
                const nested = await readFile(path.join(p, ".imgly-labs.json")).then(() => true, () => false);
                if (!nested) yield* walk(p, false);
              } else if (e.isFile()) yield p;
            }
          }

          // Files tracked in Git LFS are sent as their oid: labs serves them from lfs.imgly.dev's bucket,
          // so large media never travels in this request. Matched by path; labs checks the repo pushed the oid.
          const lfs = new Map();
          let lfsHere = false;
          async function pointerOid(file) {
            const { size } = await stat(file);
            if (size > 1024) return null;
            const m = (await readFile(file, "utf8")).match(/^version https:\/\/git-lfs\.github\.com\/spec\/v1\noid sha256:([0-9a-f]{64})\nsize \d+\n?$/);
            return m ? m[1] : null;
          }
          try {
            const lfsUrl = execFileSync("git", ["config", "-f", ".lfsconfig", "--get", "lfs.url"], { encoding: "utf8" });
            if (!lfsUrl.startsWith("https://lfs.imgly.dev/")) throw new Error("LFS is not on lfs.imgly.dev");
            lfsHere = true;
            for (const line of execFileSync("git", ["lfs", "ls-files", "--long"], { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 }).split("\n")) {
              const m = line.match(/^([0-9a-f]{64}) [*-] (.+)$/);
              if (m) lfs.set(path.resolve(m[2]), m[1]);
            }
          } catch {
            // No git-lfs, no LFS files, or LFS elsewhere: everything is uploaded as bytes.
          }

          const form = new FormData();
          form.append("config", configText);
          form.append("path", dir);
          let count = 0;
          let objects = 0;
          if (assetsDir) {
            for await (const file of walk(assetsDir, true)) {
              const rel = "/" + path.relative(assetsDir, file).split(path.sep).join("/");
              let oid = lfs.get(file);
              // A pointer copied by a build (public/ -> dist/) is recognised by its content.
              if (!oid && lfsHere) oid = await pointerOid(file);
              if (oid) {
                form.append(`object:${rel}`, oid);
                objects++;
              } else {
                form.append(`file:${rel}`, new Blob([await readFile(file)]), path.basename(file));
                count++;
              }
            }
          }
          if (process.env.APP_BUNDLE) {
            form.append("worker", new Blob([await readFile(process.env.APP_BUNDLE)]), "app.js");
          }
          const prefix = `LABS_${config.id.toUpperCase()}_`;
          const secrets = Object.entries(JSON.parse(process.env.LABS_SECRETS || "{}")).filter(([k]) => k.startsWith(prefix) && k.length > prefix.length);
          for (const [key, value] of secrets) form.append(`secret:${key.slice(prefix.length)}`, value);
          if (config.migrations) {
            const migrationsDir = path.resolve(projectDir, config.migrations);
            if (!inside(migrationsDir)) {
              console.log(`::error::migrations must stay inside ${dir}`);
              process.exit(1);
            }
            for (const name of (await readdir(migrationsDir)).filter((n) => n.endsWith(".sql")).sort()) {
              form.append(`migration:${name}`, new Blob([await readFile(path.join(migrationsDir, name))]), name);
            }
          }

          const idRes = await fetch(
            `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encodeURIComponent(labs)}`,
            { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } }
          );
          const { value: token } = await idRes.json();

          const res = await fetch(`${labs}/deploy`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: form,
          });
          const text = await res.text();
          if (!res.ok) {
            console.log(`::error::Deploy of ${dir} failed (${res.status}): ${text}`);
            process.exit(1);
          }
          const out = JSON.parse(text);
          console.log(`Deployed ${count} files${objects ? `, ${objects} LFS objects` : ""}${process.env.APP_BUNDLE ? " and worker code" : ""}${secrets.length ? `, ${secrets.length} secrets` : ""}`);
          console.log(`Share: ${out.url}`);
          console.log(`Direct: ${out.projectUrl}`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `### ${config.name}\n\n${out.url}\n`);
          JS
